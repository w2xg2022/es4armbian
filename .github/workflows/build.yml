name: Build EmulationStation (Armbian aarch64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: arm64v8/debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config gettext ca-certificates \
            libsdl2-dev libsdl2-mixer-dev \
            libfreeimage-dev libfreetype-dev \
            libcurl4-openssl-dev libpugixml-dev rapidjson-dev \
            libasound2-dev libvlc-dev libvlccore-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (CMake)
        run: |
          mkdir -p build
          cd build
          cmake .. -DGLES=OFF -DGLES2=ON -DCEC=OFF -DENABLE_EMUELEC=1

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package artifacts
        run: |
          mkdir -p dist/emulationstation
          cp build/emulationstation2 dist/emulationstation/emulationstation
          cp -r resources dist/emulationstation/
          cp -r locale dist/emulationstation/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-armbian-aarch64
          path: dist/
